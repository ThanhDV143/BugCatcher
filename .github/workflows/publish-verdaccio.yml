name: Publish UPM Package
run-name: 📦 ${{ github.event.repository.name }}@${{ github.ref_name }} → Verdaccio

# Triggered when a Git Tag matching v* is pushed
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-package:
    runs-on: ubuntu-latest

    # ====================================================================
    # 🔧 PER-PROJECT CONFIG — change this ONE line when copying to a new project
    # ====================================================================
    defaults:
      run:
        working-directory: Packages/thanhdv.bugcatcher

    # ====================================================================
    # 🌐 SHARED CONFIG — same across all your projects, rarely changes
    # ====================================================================
    env:
      REGISTRY_URL: https://upm.thanhdv.com
      NODE_VERSION: '22.x'
      UPM_CLI_VERSION: 'v9.36.0' # Unity UPM CLI used to sign the package (latest: https://cdn.packages.unity.com/upm-cli/latest.txt)

    steps:
      # Step 1: Checkout the source code at the pushed tag
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Set up Node.js and point to your Verdaccio registry
      - name: Setup NodeJS & Registry
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      # Step 3: Extract package info from package.json for Discord notification.
      # - name:        technical id (e.g. "com.tayx.graphy") — used in URL & registry
      # - version:     semver string
      # - displayName: human-friendly name (e.g. "Graphy") — used in Discord title.
      #                Falls back to `name` if displayName is not set in package.json.
      - name: Extract Package Info
        id: pkg-info
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "display_name=$(node -p "require('./package.json').displayName || require('./package.json').name")" >> $GITHUB_OUTPUT

      # Step 4: Install Unity's UPM CLI (the script verifies the download's SHA256).
      - name: Install UPM CLI
        id: install-upm
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | bash -s -- "$UPM_CLI_VERSION"
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      # Step 5: Pack + sign the package with a Unity service account, so Unity 6.3+
      # does not show the "Missing Signature" warning when the package is installed.
      # Needs a service account with the "Package Manager Package Signer" role.
      - name: Sign package
        id: sign
        run: |
          OUT_DIR="$RUNNER_TEMP/upm-signed"
          upm pack . --organization-id "$UNITY_ORG_ID" --destination "$OUT_DIR"
          TGZ=$(ls "$OUT_DIR"/*.tgz)
          tar -tzf "$TGZ" | grep -i attestation || echo "::warning::No attestation file found in $TGZ"
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
        env:
          UNITY_ORG_ID: ${{ secrets.UNITY_ORG_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}

      # Step 6: Publish the signed tarball as-is to Verdaccio using the secure token.
      # Do not repack it: any change to the tarball invalidates the signature.
      - name: Publish to Verdaccio
        id: publish
        run: npm publish "${{ steps.sign.outputs.tgz }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      # Step 7: Send a Discord notification based on job result

      # 1. Notify on SUCCESS
      - name: Discord Notification (Success)
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: "GitHub Actions CI/CD"
          status: success
          nodetail: true # Removes extra detail lines (author, branch, commit) from the notification
          title: "✅ Success: ${{ steps.pkg-info.outputs.display_name }} v${{ steps.pkg-info.outputs.version }}"
          description: |
            Build **#${{ github.run_number }}** published package `${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}` successfully.
            **Build Log:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Package URL:** ${{ env.REGISTRY_URL }}/-/web/detail/${{ steps.pkg-info.outputs.name }}

      # 2. Notify on FAILURE
      - name: Discord Notification (Failure)
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: "GitHub Actions CI/CD"
          status: failure
          nodetail: true
          title: "❌ Failure: ${{ steps.pkg-info.outputs.display_name || github.event.repository.name }} ${{ github.ref_name }}"
          description: |
            Build **#${{ github.run_number }}** failed for package `${{ steps.pkg-info.outputs.name || github.event.repository.name }}` at tag `${{ github.ref_name }}`.
            **Reason:** ${{ steps.install-upm.outcome == 'failure' && 'Install UPM CLI step failed.' || steps.sign.outcome == 'failure' && 'Sign step failed (check UNITY_ORG_ID / UPM service account secrets).' || steps.publish.outcome == 'failure' && 'Publish step failed (check VERDACCIO_TOKEN or whether this version already exists).' || 'A setup step failed, see the build log.' }}
            **Build Log:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 3. Notify on CANCELLED
      - name: Discord Notification (Cancelled)
        if: cancelled()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          username: "GitHub Actions CI/CD"
          status: cancelled
          nodetail: true
          title: "ℹ️ Cancelled: ${{ steps.pkg-info.outputs.display_name || github.event.repository.name }} ${{ github.ref_name }}"
          description: |
            Build **#${{ github.run_number }}** for job `${{ github.workflow }}` at tag `${{ github.ref_name }}` was aborted manually.
            **Build Log:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
